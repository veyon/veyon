<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the root-owned Veyon service may own and call the privileged
       authentication helper. Non-root callers are rejected by the default
       method_call deny policy. -->
  <policy user="root">
    <allow own="io.veyon.AuthHelper"/>
    <allow send_destination="io.veyon.AuthHelper"/>
  </policy>
</busconfig>
