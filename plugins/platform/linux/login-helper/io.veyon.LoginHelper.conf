<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="io.veyon.LoginHelper" send_interface="io.veyon.LoginHelper" send_member="RegisterAgent"/>
    <allow send_destination="io.veyon.LoginHelper" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.veyon.LoginHelper" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy user="root">
    <allow own="io.veyon.LoginHelper"/>
    <allow send_destination="io.veyon.LoginHelper"/>
    <!-- The greeter bridge has a unique bus name, not the helper's name. -->
    <allow send_type="method_call" send_interface="io.veyon.LoginAgent"
           send_path="/io/veyon/LoginAgent" send_member="Login"/>
    <allow send_type="method_call" send_interface="io.veyon.LoginAgent"
           send_path="/io/veyon/LoginAgent" send_member="Cancel"/>
  </policy>
</busconfig>
