# Supervised by the greeter capture child, only when its account has no daemon.
# No audio devices, portal or session manager are started.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    link.max-buffers = 16
}
context.spa-libs = {
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access }
]
