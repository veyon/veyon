name: VeyonCrypto checks

on:
  push:
    tags-ignore:
      - "v*.*.*"
    branches:
      - '**'
  pull_request:

jobs:
  check-veyon-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: VeyonCrypto OpenSSL version guards, public headers and core headers (06-pki.md §2)
        run: .ci/common/check-openssl-version-guards.sh
