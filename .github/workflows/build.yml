name: "Insight Teacher Build & Release"

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: "Build Windows Installer (x86_64)"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-openldap
            mingw-w64-x86_64-cyrus-sasl
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-lzo2

      - name: Configure CMake & Build Installer
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON \
            -DWITH_TESTS=OFF \
            -DMINGW_PREFIX=/mingw64 \
            -DLdap_INCLUDE_DIRS=/mingw64/include \
            -DLdap_LIBRARIES="/mingw64/lib/libldap.dll.a;/mingw64/lib/liblber.dll.a" \
            -DSasl2_INCLUDE_DIRS=/mingw64/include \
            -DSasl2_LIBRARIES=/mingw64/lib/libsasl2.dll.a
          ninja create-windows-installer || ninja windows-binaries
          cp -f *setup.exe ../ || true
          cp -f InsightTeacher* ../ || true

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsightTeacher-Windows-Setup
          path: |
            *setup.exe
            InsightTeacher*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *setup.exe
            InsightTeacher*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
