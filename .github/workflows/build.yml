name: "Insight Teacher Build & Release"

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: "Build Windows Installer (x86_64)"
    runs-on: ubuntu-latest
    container:
      image: docker.io/veyon/ci-mingw-w64:4.8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Windows Installer
        run: |
          .ci/windows/build.sh x86_64

      - name: List Output Files
        run: |
          ls -la *setup.exe InsightTeacher* || true

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsightTeacher-Windows-Setup
          path: |
            *setup.exe
            *.exe
            !*.dll
