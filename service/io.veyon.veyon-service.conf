<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The Veyon service owns this name. Method calls from unprivileged
       clients are delivered to the service which verifies the caller's
       identity (uid and executable) before performing any authentication. -->
  <policy user="root">
    <allow own="io.veyon.veyon-service"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.veyon.veyon-service"/>
  </policy>
</busconfig>
